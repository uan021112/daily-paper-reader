          query: transformer models for 3D reconstruction similar to DUST3R
        - keyword: geometric 3D vision
          keyword_cn: 几何3D视觉
          query: geometric 3D vision models and improvements
      intent_queries:
        - query: locate improvements to transformer based 3D reconstruction
          query_cn: 定位基于Transformer的3D重建的改进
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-08-17T03:02:04.247Z'
