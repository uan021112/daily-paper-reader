          query: transformer architecture for geometric vision tasks
      intent_queries:
        - query: How to jointly predict depth, normals, and camera pose with transformer models
          query_cn: 如何用transformer模型联合预测深度、法线和相机位姿
          enabled: true
          source: manual
          note: ''
